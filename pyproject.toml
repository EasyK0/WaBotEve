[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wabot"
version = "1.10.0"
description = "Discord bot for EVE Online: site respawn timers, market reports and killmail feeds"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["discord.py==2.7.1", "aiosqlite==0.22.1", "aiohttp==3.14.3", "filelock==3.32.7"]

[project.scripts]
wabot = "wabot.__main__:main"

[project.gui-scripts]
wabot-launcher = "wabot.desktop_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wabot = ["migrations/*.sql", "assets/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
