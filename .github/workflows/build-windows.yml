name: Windows installer

# Builds a generic WabotSetup.exe (no settings, no data, no token) as a downloadable artifact.
on:
  workflow_dispatch:
  push:
    branches: [main, windows-exe-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt
      - run: pip install --no-deps -e .
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        run: python scripts/build_windows.py --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Self-test the frozen app
        run: dist\windows\Wabot\WabotWorker.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: WabotSetup-${{ github.sha }}
          path: |
            dist/windows/WabotSetup.exe
            dist/windows/WabotSetup.sha256
            dist/windows/build-info.json
            dist/windows/Instrukcja.md
          if-no-files-found: error
